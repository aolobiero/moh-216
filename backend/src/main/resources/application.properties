spring.application.name=moh216

server.port=8080

# PostgreSQL configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moh216_db}
spring.datasource.username=${DB_USERNAME:moh216_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Development-only generated user. Replace with database-backed staff identities before production.
spring.security.user.roles=ADMIN
